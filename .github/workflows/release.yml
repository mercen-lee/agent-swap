name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft-release:
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      AGENTSWAP_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$AGENTSWAP_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Use vMAJOR.MINOR.PATCH with an optional prerelease suffix.' >&2
            exit 1
          fi
      - name: Test Core
        timeout-minutes: 5
        run: ./scripts/test-core.sh
      - name: Verify stable release signing boundary
        timeout-minutes: 2
        run: python3 scripts/test-release-signing.py
      - name: Import dedicated release signing identity
        env:
          AGENTSWAP_SIGNING_P12_BASE64: ${{ secrets.AGENTSWAP_SIGNING_P12_BASE64 }}
          AGENTSWAP_SIGNING_P12_PASSWORD: ${{ secrets.AGENTSWAP_SIGNING_P12_PASSWORD }}
        run: python3 scripts/prepare-release-signing.py prepare
      - name: Package Universal app
        id: package
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [[ -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Configure the repository SPARKLE_PRIVATE_KEY secret before releasing.' >&2
            exit 1
          fi
          ./scripts/package-release.sh "${AGENTSWAP_TAG#v}"
      - name: Delete temporary signing keychain
        if: always()
        run: python3 scripts/prepare-release-signing.py cleanup
      - name: Verify release assets
        env:
          AGENTSWAP_ZIP: ${{ steps.package.outputs.zip_path }}
          AGENTSWAP_CHECKSUMS: ${{ steps.package.outputs.checksum_path }}
          AGENTSWAP_APPCAST: ${{ steps.package.outputs.appcast_path }}
        run: |
          test -s "$AGENTSWAP_ZIP"
          test -s "$AGENTSWAP_APPCAST"
          cd "$(dirname "$AGENTSWAP_CHECKSUMS")"
          shasum -a 256 -c SHA256SUMS
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          AGENTSWAP_ZIP: ${{ steps.package.outputs.zip_path }}
          AGENTSWAP_CHECKSUMS: ${{ steps.package.outputs.checksum_path }}
          AGENTSWAP_APPCAST: ${{ steps.package.outputs.appcast_path }}
        shell: bash
        run: |
          set -euo pipefail
          AGENTSWAP_CHECKOUT_SHA="$(git rev-parse HEAD)"
          AGENTSWAP_REMOTE_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$AGENTSWAP_TAG" --jq .sha)"
          if [[ "$AGENTSWAP_CHECKOUT_SHA" != "$AGENTSWAP_REMOTE_SHA" ]]; then
            echo 'The remote tag changed after checkout; release creation stopped.' >&2
            exit 1
          fi
          AGENTSWAP_IS_PRERELEASE=false
          if [[ "$AGENTSWAP_TAG" == *-* ]]; then
            AGENTSWAP_IS_PRERELEASE=true
          fi
          cat > "$RUNNER_TEMP/agentswap-release-notes.md" <<'NOTES'
          AgentSwap development build for macOS 14 or later, with a Universal arm64/x86_64 app.

          Extract the ZIP to obtain AgentSwap.app. Verify it with the included SHA256SUMS.
          AgentSwap checks GitHub Releases for updates. The signed appcast.xml and ZIP are hosted as release assets; no separate update server is used.
          Versions before v0.1.0-beta.6 need a one-time manual download to enable the updater.
          The app uses the project's dedicated signing certificate so its Keychain identity is stable across updates. This is a self-signed certificate; Apple Developer ID signing and notarization are not included.
          Releases through v0.1.0-beta.7 used ad-hoc signing. Upgrading from those versions can require a one-time Keychain approval.
          The project remains in development. See README and docs/VALIDATION.md for known limitations.
          NOTES
          gh release create "$AGENTSWAP_TAG" "$AGENTSWAP_ZIP" "$AGENTSWAP_CHECKSUMS" "$AGENTSWAP_APPCAST" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --draft --prerelease="$AGENTSWAP_IS_PRERELEASE" --latest=false \
            --title "AgentSwap $AGENTSWAP_TAG" \
            --notes-file "$RUNNER_TEMP/agentswap-release-notes.md"
